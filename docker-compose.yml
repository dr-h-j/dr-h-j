# mall-cloud 本地开发环境：Nacos + MySQL + Redis 一键启动
# 用法：docker compose up -d
#   - Nacos 控制台: http://127.0.0.1:8848/nacos  （nacos/nacos，默认账号密码）
#   - MySQL: 127.0.0.1:3307  root/123456（首次启动自动执行 sql/init.sql 建库建表）
#   - Redis: 127.0.0.1:6379  无密码

services:
  nacos:
    image: nacos-registry.cn-hangzhou.cr.aliyuncs.com/nacos/nacos-server:v2.3.2
    container_name: mall-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"   # 控制台 + Nacos 客户端端口
      - "9848:9848"   # gRPC 端口（客户端连接用）
      - "9849:9849"
    restart: unless-stopped

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: mall-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - TZ=Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: mall-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql-data:
