#       server-addr: ${NACOS_ADDR:127.0.0.1:8848}
#   config:
#     type: nacos
#     nacos:
#       server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.djwk.mall.order: INFO
